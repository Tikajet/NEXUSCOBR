services:
  - type: web
    name: nexus-cobr
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nexus-db
    databaseName: nexuscobr
    user: nexususer
